name: "AskGeminiAndReturnAnswer"
description: "Use local Chrome to ask Gemini a question, wait for the page to finish, and return the extracted answer text."
tags:
  - browser
  - chrome
  - research
  - gemini
  - web
owner_agents:
  - general
  - researcher
tools:
  - chrome_browser
steps:
  - "chrome_browser.open_url -> https://gemini.google.com"
  - "chrome_browser.wait_for_idle"
  - "chrome_browser.fill_prompt with the user's task"
  - "chrome_browser.submit_prompt"
  - "chrome_browser.wait_for_text or wait_for_idle until the answer appears"
  - "chrome_browser.get_page_text and return the useful answer excerpt"
success_criteria:
  - "The target Gemini page opens in Google Chrome."
  - "The prompt is filled and submitted."
  - "Readable answer text is extracted from the page."
created_by: "preset"
review_status: "approved"

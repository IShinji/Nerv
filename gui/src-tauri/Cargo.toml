[package]
name = "nerv-gui"
version = "0.2.0"
description = "Nerv desktop GUI"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Same supervised brain client and config loader the gateway uses, so both
# hosts spawn the brain identically instead of diverging.
nerv-brain = { path = "../../core/brain" }
nerv-shared = { path = "../../core/shared", features = ["brain-client"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"

# Nerv — Default Configuration
# Copy to config.yaml and customize for your setup.
# config.yaml is gitignored — safe for secrets.

channels:
  cli:
    enabled: true          # Terminal adapter for development/debugging
  telegram:
    enabled: false         # Set to true and add bot_token in config.yaml
    bot_token: ""          # Telegram Bot API token

models:
  router:
    provider: "ollama"     # ollama | anthropic | openai | google
    model: "qwen2.5:1.5b"   # Balanced local base model for routing and light chat
    base_url: "http://localhost:11434"
  tiers:
    tier0: "qwen2.5:1.5b"   # Default local base model for daily tasks
    tier1: "qwen2.5:7b"   # Better reasoning for normal tasks
    tier2: "qwen2.5:14b"  # Heavy local tasks
    tier3: "qwen2.5:32b"  # Frontier / expensive local tasks

logging:
  level: "info"            # trace | debug | info | warn | error

# Brain (Python) process settings
brain:
  python_command: "uv run python"  # Uses uv-managed venv in brain/
  module: "nerv"            # Python module to run (python -m nerv)
  auto_install_ollama: false  # Run the official Ollama installer if local Ollama is missing/down
  restart_max: 3            # Max restart attempts on crash

# Optional MCP integrations.
# Rust currently ignores this block; the Python brain reads it directly.
mcp:
  protocol_version: "2024-11-05"
  servers:
    chrome:
      enabled: false
      preset: ""            # Example: "chrome_devtools_official"
      transport: "stdio"
      command: ""           # Leave empty to use preset defaults, or set explicitly.
      args: []               # Leave empty to use preset defaults, or set explicitly.
      cwd: ""
      env: {}
      capabilities: ["browser.interactive"]
      action_map: {}         # Optional custom overrides for non-preset servers.

# Nerv — Default Configuration
# Copy to config.yaml and customize for your setup.
# config.yaml is gitignored — safe for secrets.

channels:
  cli:
    enabled: true          # Terminal adapter for development/debugging
  telegram:
    enabled: false         # Set to true and add bot_token in config.yaml
    bot_token: ""          # Telegram Bot API token
    # REQUIRED when telegram is enabled. Nerv can run shell commands and read
    # your filesystem, so an open bot is a remote shell for anyone who finds
    # it. This list fails closed: empty means nobody is authorized and the
    # gateway refuses to start the adapter. Put your own Telegram user id here
    # (message @userinfobot to find it).
    allowed_users: []      # e.g. ["123456789"]

# Model strings use a provider-prefix scheme — the active backend is a pure
# config switch (no code change needed to swap providers):
#   "claude-cli:<alias>"   → local Claude Code CLI (uses your Claude subscription)
#   "local:<ollama-model>" → local Ollama HTTP (reserved; dormant)
#   "litellm:<model>"      → cloud API via litellm (reserved)  e.g. litellm:claude-opus-4-8
models:
  router:
    model: "claude-cli:opus"   # Intent classifier — currently Opus for validation
  tiers:
    tier0: "claude-cli:opus"   # simple tasks / chat
    tier1: "claude-cli:opus"   # medium tasks
    tier2: "claude-cli:opus"   # complex tasks
    tier3: "claude-cli:opus"   # critical / frontier tasks
  # === Reserved: switch back to local/tiered models by editing the above. ===
  # router: {provider: ollama, model: "qwen2.5:1.5b", base_url: "http://localhost:11434"}
  # tiers:
  #   tier0: "local:qwen2.5:1.5b"
  #   tier1: "claude-cli:sonnet"
  #   tier2: "claude-cli:sonnet"
  #   tier3: "claude-cli:opus"

# Tool sandbox: tools may freely modify paths inside workspace_root; operations
# touching paths outside it (or shell / desktop control) are routed through the
# user-confirmation queue. Empty = the Nerv project root.
security:
  workspace_root: ""

# Proactive monitoring runs on the heartbeat (deterministic, no model calls).
proactive:
  enabled: true
  calendar_reminder_minutes: 60   # remind about events starting within this window

logging:
  level: "info"            # trace | debug | info | warn | error

# Brain (Python) process settings
brain:
  python_command: "uv run python"  # Uses uv-managed venv in brain/
  module: "nerv"            # Python module to run (python -m nerv)
  auto_install_ollama: false  # Only used when a local: model is configured
  restart_max: 3            # Max respawns of a crashed brain before giving up
  call_timeout_secs: 300    # Per-request ceiling; a wedged brain errors out
  heartbeat_interval_secs: 30  # Proactive check interval (no model calls)

# Optional MCP integrations.
# Rust currently ignores this block; the Python brain reads it directly.
mcp:
  protocol_version: "2024-11-05"
  servers:
    chrome:
      enabled: false
      preset: ""            # Example: "chrome_devtools_official"
      transport: "stdio"
      command: ""           # Leave empty to use preset defaults, or set explicitly.
      args: []               # Leave empty to use preset defaults, or set explicitly.
      cwd: ""
      env: {}
      capabilities: ["browser.interactive"]
      action_map: {}         # Optional custom overrides for non-preset servers.

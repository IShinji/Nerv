[project]
name = "nerv-brain"
version = "0.1.0"
description = "Nerv Brain — Router, Orchestrator, and Agent runtime"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "litellm>=1.20",
    "python-dotenv>=1.0",
    "playwright>=1.58.0",
    "mcp>=1.2,<2",
]

[project.scripts]
nerv-brain = "nerv.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nerv"]

[tool.ruff]
# 88 columns (CONVENTIONS.md). `ruff format` enforces this for code; the E501
# lint rule is off because the only lines it can still flag are string literals
# the formatter deliberately will not split — prompt text, tool descriptions,
# AppleScript snippets — where wrapping would change the value being sent.
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
